services:
  - type: web
    name: cmcs-portfolio-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.demo
    healthCheckPath: /health
    envVars:
      - key: AllowedHosts
        value: "cmcs-portfolio-demo.onrender.com;localhost;127.0.0.1"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_HTTPS_PORT
        value: "443"
      - key: CMCS_DEMO_MODE
        value: "true"
      - key: CMCS_DEMO_DATA_DIR
        value: /tmp/cmcs-demo

